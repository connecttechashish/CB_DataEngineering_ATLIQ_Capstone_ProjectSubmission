name: 'atliq_commerce'
version: '1.0.0'

profile: 'atliq_commerce'

model-paths: ["models"]
#analysis-paths: ["analyses"]
#test-paths: ["tests"]
#seed-paths: ["seeds"]
#macro-paths: ["macros"]
#snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  atliq_commerce:
      +materialized: table
      +file_format: delta
      +location_root: "{{ 'abfss://lakehouse@atliqadls.dfs.core.windows.net/gold' if target.name == 'prod' else 'abfss://lakehouse@atliqadls.dfs.core.windows.net/ci_validation' }}"
      #+location_root: "abfss://lakehouse@atliqadls.dfs.core.windows.net"
      #+location_root: "abfss://lakehouse@atliqadls.dfs.core.windows.net/gold"
